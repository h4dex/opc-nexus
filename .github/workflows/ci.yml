name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Hermes-compatible npm
        run: npm install --global npm@11.16.0

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install Hermes Python runtime
        run: uv python install 3.11

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Prepare pinned Hermes runtime
        run: npm run hermes:prepare

      - name: Verify pinned Hermes runtime
        run: npm run hermes:verify

      - name: Smoke test Hermes Dashboard and Gateway
        run: npm run hermes:smoke

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundles
        run: npm run build
