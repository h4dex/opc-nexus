name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, for example v1.8.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  HARNESS_NPM_VERSION: "11.16.0"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  ANDROID_SIGNER_SHA256: "ec3f987b968cb7483a0fd08a64a5a1d0944a6d3c88679248b5d70c036226281d"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Harness-compatible npm
        run: npm install --global npm@${{ env.HARNESS_NPM_VERSION }}

      - name: Verify tag matches package version
        run: >-
          node -e "const p=require('./package.json'); const expected='v'+p.version;
          if(process.env.RELEASE_TAG!==expected){console.error('Expected tag '+expected+', got '+process.env.RELEASE_TAG); process.exit(1)}"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Prepare pinned DeepSeek Harness runtime
        run: npm run harness:prepare

      - name: Prepare pinned managed DeepSeek Harness runtime
        run: npm run harness:managed:prepare

      - name: Verify Harness with Electron Node
        run: npm run harness:verify:electron

      - name: Verify managed Harness with Electron Node
        run: npm run harness:managed:verify:electron

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build-android:
    name: Build Android Bridge
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      OPCNEXUS_ANDROID_STORE_PASSWORD: ${{ secrets.OPCNEXUS_ANDROID_STORE_PASSWORD }}
      OPCNEXUS_ANDROID_KEY_ALIAS: ${{ secrets.OPCNEXUS_ANDROID_KEY_ALIAS }}
      OPCNEXUS_ANDROID_KEY_PASSWORD: ${{ secrets.OPCNEXUS_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Restore Android production keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.OPCNEXUS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          for name in KEYSTORE_BASE64 OPCNEXUS_ANDROID_STORE_PASSWORD OPCNEXUS_ANDROID_KEY_ALIAS OPCNEXUS_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/opcnexus-android-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "OPCNEXUS_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Run Android unit tests
        working-directory: mobile/android-bridge
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build and verify signed Android APK
        run: npm run mobile:apk:release

      - name: Verify production signing certificate
        run: >-
          node -e "const m=require('./mobile/dist/apk-manifest.json');
          if(m.signerSha256.toLowerCase()!==process.env.ANDROID_SIGNER_SHA256){
          console.error('Unexpected Android signer certificate: '+m.signerSha256);process.exit(1)}"

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/dist/*.apk
            mobile/dist/apk-manifest.json

  build-windows:
    name: Build Windows x64
    needs:
      - validate
      - build-android
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Harness-compatible npm
        run: npm install --global npm@${{ env.HARNESS_NPM_VERSION }}

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Prepare pinned DeepSeek Harness runtime
        run: npm run harness:prepare

      - name: Prepare pinned managed DeepSeek Harness runtime
        run: npm run harness:managed:prepare

      - name: Verify Harness with Electron Node
        run: npm run harness:verify:electron

      - name: Verify managed Harness with Electron Node
        run: npm run harness:managed:verify:electron

      - name: Download signed Android package
        uses: actions/download-artifact@v4
        with:
          name: android-${{ env.RELEASE_TAG }}
          path: mobile/dist

      - name: Verify embedded Android package
        run: npm run mobile:apk:verify-release

      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build && npx electron-builder --win --x64 --publish never

      - name: Verify packaged Windows Harness runtime
        run: npm run harness:verify:packaged -- release/win-unpacked

      - name: Verify packaged Windows managed Harness runtime
        run: npm run harness:managed:verify:packaged -- release/win-unpacked

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  build-linux:
    name: Build Linux x64
    needs:
      - validate
      - build-android
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Harness-compatible npm
        run: npm install --global npm@${{ env.HARNESS_NPM_VERSION }}

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Prepare pinned DeepSeek Harness runtime
        run: npm run harness:prepare

      - name: Prepare pinned managed DeepSeek Harness runtime
        run: npm run harness:managed:prepare

      - name: Verify Harness with Electron Node
        run: npm run harness:verify:electron

      - name: Verify managed Harness with Electron Node
        run: npm run harness:managed:verify:electron

      - name: Download signed Android package
        uses: actions/download-artifact@v4
        with:
          name: android-${{ env.RELEASE_TAG }}
          path: mobile/dist

      - name: Verify embedded Android package
        run: npm run mobile:apk:verify-release

      - name: Package Linux applications
        run: npm run build && npx electron-builder --linux --x64 --publish never

      - name: Verify packaged Linux Harness runtime
        run: npm run harness:verify:packaged -- release/linux-unpacked

      - name: Verify packaged Linux managed Harness runtime
        run: npm run harness:managed:verify:packaged -- release/linux-unpacked

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux.yml

  publish:
    name: Publish GitHub Release
    needs:
      - build-android
      - build-windows
      - build-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Normalize release filenames
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          manifest="release-assets/apk-manifest.json"
          if [[ ! -f "$manifest" ]]; then
            echo "Android APK manifest is missing" >&2
            exit 1
          fi
          bridge_version="$(jq -r '.versionName' "$manifest")"
          if [[ ! "$bridge_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid Android Bridge version: $bridge_version" >&2
            exit 1
          fi
          android_apk="OPC-Nexus-Mobile-Bridge-${bridge_version}-release.apk"
          android_manifest="OPC-Nexus-Mobile-Bridge-${bridge_version}-manifest.json"
          while IFS= read -r -d '' asset; do
            case "$asset" in
              *.exe.blockmap) target="OPC-Nexus-Setup-${version}-x64.exe.blockmap" ;;
              *.exe) target="OPC-Nexus-Setup-${version}-x64.exe" ;;
              *.AppImage.blockmap) target="OPC-Nexus-${version}-x86_64.AppImage.blockmap" ;;
              *.AppImage) target="OPC-Nexus-${version}-x86_64.AppImage" ;;
              *.deb) target="OPC-Nexus-${version}-amd64.deb" ;;
              */opcnexus-mobile-bridge-*-release.apk) target="$android_apk" ;;
              */apk-manifest.json) target="$android_manifest" ;;
              */latest.yml|*/latest-linux.yml) continue ;;
              *) echo "Unexpected release asset: $asset" >&2; exit 1 ;;
            esac
            mv -- "$asset" "release-assets/$target"
          done < <(find release-assets -mindepth 1 -maxdepth 1 -type f -print0)

          jq --arg filename "$android_apk" '.filename = $filename' \
            "release-assets/$android_manifest" > "release-assets/$android_manifest.tmp"
          mv "release-assets/$android_manifest.tmp" "release-assets/$android_manifest"

          if [[ -f release-assets/latest.yml ]]; then
            sed -i -E "s#^([[:space:]]*(url|path): ).*\.exe$#\1OPC-Nexus-Setup-${version}-x64.exe#" release-assets/latest.yml
          fi
          if [[ -f release-assets/latest-linux.yml ]]; then
            sed -i -E "s#^([[:space:]]*(url|path): ).*\.AppImage$#\1OPC-Nexus-${version}-x86_64.AppImage#" release-assets/latest-linux.yml
          fi

          for required in \
            "OPC-Nexus-Setup-${version}-x64.exe" \
            "OPC-Nexus-${version}-x86_64.AppImage" \
            "OPC-Nexus-${version}-amd64.deb" \
            "$android_apk" \
            "$android_manifest"; do
            if [[ ! -f "release-assets/$required" ]]; then
              echo "Required release asset is missing: $required" >&2
              exit 1
            fi
          done

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          pushd release-assets >/dev/null
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          popd >/dev/null

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "OPC-Nexus ${RELEASE_TAG#v}"
          fi
