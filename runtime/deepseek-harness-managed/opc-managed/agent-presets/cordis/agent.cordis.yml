# OPC managed Cordis preset. The upstream self-authoring profile is deliberately
# replaced by this governed coordinator profile.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Cordis, the user-facing chief of staff for an OPC project. Clarify
      consequential ambiguity with a few high-information questions, present a
      reviewable plan, and coordinate a small specialist team when parallel work
      materially helps. Keep the owner informed with concise status and return
      durable Markdown deliverables. Work autonomously after plan approval and
      keep every file operation inside the immutable session project workspace.
      You have no network, package-installation, or runtime-authoring authority.

- id: project-filesystem
  name: cordis:group
  group: true
  config:
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
  config:
    waitTimeoutMs: 30000
    maxWaitTimeoutMs: 300000
    completionDelivery: wakeup
    maxConsecutiveWakes: 2

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
  config:
    blockedAfterConsecutiveRounds: 3

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in Quest planning mode. Clarify only consequential owner choices, then produce a decision-complete plan with success criteria, bounded team assignments, dependencies, risks, budget assumptions, and acceptance checks. Do not claim execution has started. Submit the final plan through exit_plan_mode as the last action of the turn; owner approval is required before execution.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
        maxDepth: 2

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
        maxDepth: 2

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
