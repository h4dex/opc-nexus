# OPC-Nexus managed Web policy. The pinned preset compositions themselves are
# replaced only after their reviewed upstream SHA-256 values are verified.
- id: settings
  disabled: true

- id: credentials
  disabled: true

# Provider identity and model selection are owned by Nexus. The DSH process
# receives only a short-lived proxy capability and the scoped model name.
- id: llm-pi-ai
  disabled: true

- id: agent-default-model
  config:
    provider: deepseek-official
    model: !!js "process.env.AIBOX_DSH_MODEL || 'deepseek-chat'"

- id: ui-settings-models
  disabled: true

- id: ui-model-selection
  disabled: true

# Quest sessions receive a Main-approved project cwd. Keep DSH's native
# directory-picker Host out of the managed profile: its Koffi worker is not
# reliable in packaged Electron on Windows and users must not escape the
# project workspace through the embedded Web UI.
- id: directory-picker
  disabled: true

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

# A denied workspace escape stays denied instead of opening an owner prompt.
# Plan approval is handled by OPC governance before execution starts.
- id: approval
  config:
    policy: never

# Host-plane registries stay shared by all Web sessions. These limits bound
# the safe, model-facing Jobs/Goals/Subagent tools supplied by managed presets.
- id: jobs
  config:
    maxConcurrentJobsPerOwner: 4

- id: goal
  config:
    defaultMaxGoalRounds: 24

- id: agent-presets
  config:
    default: standard
    includeUserRoot: false
