# OPC-Nexus P0 ACP composition. Stdout is reserved for JSON-RPC frames.
# This composition intentionally mounts no logger, telemetry, web, shell,
# filesystem mutation tool, MCP server, or third-party agent SDK.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: deepseek-chat
      - id: deepseek-reasoner

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  disabled: !!js "!process.env.OPENAI_BASE_URL"
  config:
    providers:
      aibox-openai:
        displayName: OPC-Nexus OpenAI-compatible
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: !!js process.env.OPENAI_BASE_URL
        models:
          - id: !!js "process.env.AIBOX_DSH_MODEL ?? process.env.OPENAI_MODEL ?? 'deepseek-chat'"

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: !!js "process.env.AIBOX_DSH_PROVIDER ?? 'deepseek-official'"
    model: !!js "process.env.AIBOX_DSH_MODEL ?? 'deepseek-chat'"
    dshHome: !!js "process.env.DSH_HOME ?? './.dsh'"
    persistenceRoot: !!js "process.env.AIBOX_DSH_SESSIONS_ROOT ?? './.sessions'"
    persistenceCompression: none
    workspaceContext: false
    tools:
      mode: native
    skills:
      enabled: true
      filesystem:
        includeDefaultRoots: false
        dshHome: !!js "process.env.DSH_HOME ?? './.dsh'"
        customSkillDirs:
          - !!js process.env.AIBOX_DSH_MANAGED_SKILLS_DIR
        watch: false
        watchFollowSymlinks: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: |
      You are an AI employee managed by OPC-Nexus. Work in the session workspace
      and answer with concise, factual results. Use an available skill when its
      instructions match the task.
