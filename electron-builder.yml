appId: com.senke.aibox
productName: 数字员工 AI Box
icon: icon.png
copyright: Copyright © 2026 Senke

directories:
  output: release
  buildResources: build

electronFuses:
  runAsNode: true

# Packaging is host-platform only (enforced by beforePack), so use the exact
# Electron distribution installed by the lockfile instead of re-downloading it.
electronDist: node_modules/electron/dist

beforePack: scripts/before-pack.cjs
afterPack: scripts/after-pack.cjs

extraResources:
  - from: mobile/dist
    to: mobile/android
    filter:
      - "*.apk"
      - apk-manifest.json
  - from: mobile/hermes-plugin
    to: mobile/hermes-plugin
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: mobile/tool-catalog.json
    to: mobile/tool-catalog.json
  - from: THIRD-PARTY-NOTICES.md
    to: mobile/THIRD-PARTY-NOTICES.md
  # Pinned Hermes v0.19.0 source fork. Runtime Python is supplied by the
  # release pipeline under resources/hermes/python; never package a developer
  # venv or node_modules from the checkout.
  - from: vendor/hermes-agent
    to: hermes/hermes-agent
    filter:
      - "**/*"
      - "!node_modules/**"
      - "!venv/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!tests/**"
      - "!tests-js/**"
  - from: runtime/hermes/python
    to: hermes/python
    filter:
      - "**/*"
  - from: runtime/hermes/runtime-manifest.json
    to: hermes/runtime-manifest.json
  # Optional Codex CLI and Pi Agent package closures. The source checkout only
  # carries the pinned manifest; pack scripts materialize platform-native
  # packages here before electron-builder runs.
  - from: runtime/agent-clis
    to: agent-runtimes
    filter:
      - "**/*"
      - "!**/.cache/**"
      - "!**/package-lock.json"

files:
  - out/**
  - package.json
  - build/icon.png
  - node_modules/sql.js/**
  - node_modules/systeminformation/**
  - node_modules/express/**
  - node_modules/cors/**
  - node_modules/ws/**
  - node_modules/marked/**
  - node_modules/@larksuiteoapi/**
  - node_modules/body-parser/**
  - node_modules/accepts/**
  - node_modules/content-type/**
  - node_modules/cookie/**
  - node_modules/cookie-signature/**
  - node_modules/debug/**
  - node_modules/depd/**
  - node_modules/encodeurl/**
  - node_modules/escape-html/**
  - node_modules/etag/**
  - node_modules/finalhandler/**
  - node_modules/fresh/**
  - node_modules/http-errors/**
  - node_modules/merge-descriptors/**
  - node_modules/methods/**
  - node_modules/mime/**
  - node_modules/ms/**
  - node_modules/on-finished/**
  - node_modules/parseurl/**
  - node_modules/path-to-regexp/**
  - node_modules/proxy-addr/**
  - node_modules/qs/**
  - node_modules/range-parser/**
  - node_modules/safe-buffer/**
  - node_modules/send/**
  - node_modules/serve-static/**
  - node_modules/setprototypeof/**
  - node_modules/statuses/**
  - node_modules/type-is/**
  - node_modules/unpipe/**
  - node_modules/utils-merge/**
  - node_modules/vary/**
  - node_modules/bytes/**
  - node_modules/iconv-lite/**
  - node_modules/raw-body/**
  - node_modules/safer-buffer/**
  - node_modules/media-typer/**
  - node_modules/mime-db/**
  - node_modules/mime-types/**
  - node_modules/negotiator/**
  - node_modules/forwarded/**
  - node_modules/ipaddr.js/**
  - node_modules/toidentifier/**
  - node_modules/inherits/**
  - node_modules/destroy/**
  - node_modules/ee-first/**
  - node_modules/object-assign/**
  - node_modules/call-bind/**
  - node_modules/function-bind/**
  - node_modules/get-intrinsic/**
  - node_modules/gopd/**
  - node_modules/has-property-descriptors/**
  - node_modules/has-proto/**
  - node_modules/has-symbols/**
  - node_modules/hasown/**
  - node_modules/set-function-length/**
  - node_modules/define-data-property/**
  - node_modules/es-define-property/**
  - node_modules/es-errors/**
  - node_modules/side-channel/**
  - node_modules/axios/**
  - node_modules/form-data/**
  - node_modules/combined-stream/**
  - node_modules/delayed-stream/**
  - node_modules/asynckit/**
  - node_modules/mime-db/**
  - node_modules/follow-redirects/**
  - node_modules/protobufjs/**
  - node_modules/long/**
  - node_modules/@protobufjs/**
  - node_modules/crypto-js/**
  # Main-process secure LAN and Android worker dependencies. These are externalized
  # by electron-vite, so every production transitive must remain in app.asar.
  - node_modules/selfsigned/**
  - node_modules/@peculiar/**
  - node_modules/pkijs/**
  - node_modules/asn1js/**
  - node_modules/bytestreamjs/**
  - node_modules/pvtsutils/**
  - node_modules/pvutils/**
  - node_modules/reflect-metadata/**
  - node_modules/tslib/**
  - node_modules/tsyringe/**
  - node_modules/qrcode/**
  - node_modules/dijkstrajs/**
  - node_modules/pngjs/**
  - node_modules/string-width/**
  - node_modules/emoji-regex/**
  - node_modules/is-fullwidth-code-point/**
  - node_modules/strip-ansi/**
  - node_modules/ansi-regex/**
  - node_modules/ansi-styles/**
  - node_modules/color-convert/**
  - node_modules/color-name/**
  - node_modules/decamelize/**
  - node_modules/find-up/**
  - node_modules/locate-path/**
  - node_modules/p-locate/**
  - node_modules/p-try/**
  - node_modules/path-exists/**
  - node_modules/get-caller-file/**
  - node_modules/require-directory/**
  - node_modules/require-main-filename/**
  - node_modules/set-blocking/**
  - node_modules/which-module/**
  - node_modules/camelcase/**
  - node_modules/ajv/**
  - node_modules/fast-deep-equal/**
  - node_modules/fast-uri/**
  - node_modules/json-schema-traverse/**
  - node_modules/require-from-string/**
  # OCR（onnxruntime-node + sharp）与浏览器自动化（playwright-core）：
  # 主进程用动态 import() 加载，externalizeDepsPlugin 不会内联进产物，
  # 必须显式打包，否则安装后调用即 MODULE_NOT_FOUND。
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/playwright-core/**
  - node_modules/@playwright/mcp/**
  - node_modules/playwright/**
  # 上述三者的传递依赖
  - node_modules/adm-zip/**
  - node_modules/global-agent/**
  - node_modules/boolean/**
  - node_modules/detect-node/**
  - node_modules/es6-error/**
  - node_modules/globalthis/**
  - node_modules/json-stringify-safe/**
  - node_modules/matcher/**
  - node_modules/escape-string-regexp/**
  - node_modules/roarr/**
  - node_modules/semver-compare/**
  - node_modules/serialize-error/**
  - node_modules/sprintf-js/**
  - node_modules/type-fest/**
  - node_modules/define-properties/**
  - node_modules/object-keys/**
  - node_modules/detect-libc/**
  - node_modules/semver/**
  # electron-builder's npm collector deduplicates package names and can omit
  # nested versions. FileSet roots preserve the reviewed physical closure.
  - from: node_modules/pkijs/node_modules
    to: node_modules/pkijs/node_modules
    filter:
      - "**/*"
  - from: node_modules/qrcode/node_modules
    to: node_modules/qrcode/node_modules
    filter:
      - "**/*"
  - from: node_modules/p-locate/node_modules
    to: node_modules/p-locate/node_modules
    filter:
      - "**/*"
  - from: node_modules/tsyringe/node_modules
    to: node_modules/tsyringe/node_modules
    filter:
      - "**/*"

asar: true

# 原生二进制不压缩进 asar，否则无法被加载
asarUnpack:
  - node_modules/sql.js/dist/sql-wasm.wasm
  - node_modules/onnxruntime-node/bin/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - "**/*.node"

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 数字员工 AI Box
  include: build/installer.nsh

linux:
  executableName: aibox-control-center
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  maintainer: Senke <dev@senke.local>
  description: 数字员工 AI Box 控制中心 - 本地优先的桌面 Agent 管理器
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    entry:
      Actions: Quest;
    desktopActions:
      Quest:
        Name: Quest
        Exec: aibox-control-center --quest-only

# 签名更新（16 非功能：自动更新必须校验签名）在发布渠道配置 publish 后启用
publish: null
