asar: true

# WASM 二进制不压缩进 asar，避免加载问题
asarUnpack:
  - node_modules/sql.js/dist/sql-wasm.wasm

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 数字员工 AI Box

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  maintainer: Senke <dev@senke.local>
  description: 数字员工 AI Box 控制中心 - 本地优先的桌面 Agent 管理器
  artifactName: ${productName}-${version}-${arch}.${ext}

# 签名更新（16 非功能：自动更新必须校验签名）在发布渠道配置 publish 后启用
publish: null
